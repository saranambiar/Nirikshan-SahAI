<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GevStack - Form and Dropzone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
  /* Color Palette */
  --color-primary: #000;
  --color-white: #fff;
  --color-background: #bed7dc;
  --color-gray-light: #d3d3d3;
  --color-gray-dark: rgba(88, 87, 87, 0.822);
  --color-accent-blue: #03a9f4;
  --color-accent-green: #4CAF50;
  
  /* Transitions */
  --transition-speed: 0.3s;
  
  /* Border Radius */
  --border-radius-small: 0.5rem;
  --border-radius-large: 1rem;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  text-decoration: none;
  transition: all var(--transition-speed) ease;
}

body {
  font-family: 'Work Sans', sans-serif;
  background-color: var(--color-background);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 1rem;
}

.container {
  display: flex;
  gap: 1.5rem;
  max-width: 900px;
  width: 100%;
  justify-content: space-between;
}

.form,
.dropzone-box {
  flex: 1;
  background-color: var(--color-white);
  border-radius: var(--border-radius-large);
  padding: 2rem;
  box-shadow: rgba(0, 0, 0, 0.15) 0px 5px 20px;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.title {
  font-size: 1.75rem;
  font-weight: 600;
  margin-bottom: 1rem;
  position: relative;
  color: var(--color-primary);
}

.message {
  color: var(--color-gray-dark);
  font-size: 1rem;
  margin-bottom: 1rem;
}

.flex {
  display: flex;
  width: 100%;
  gap: 1rem;
  flex-wrap: wrap;
}

.form label {
  position: relative;
  width: 100%;
}

.form label .input {
  width: 100%;
  padding: 0.75rem;
  border: 2px solid var(--color-gray-light);
  border-radius: var(--border-radius-small);
  background-color: transparent;
  color: var(--color-primary);
  outline: none;
  transition: 
    border-color var(--transition-speed) ease,
    box-shadow var(--transition-speed) ease;
}

.form label .input:focus {
  border-color: var(--color-accent-blue);
  box-shadow: 0 0 10px rgba(3, 169, 244, 0.2);
}

.form label .input + span {
  position: absolute;
  left: 0.75rem;
  top: 0.75rem;
  color: var(--color-gray-dark);
  font-size: 0.9em;
  pointer-events: none;
  transition: all var(--transition-speed) ease;
}

.form label .input:placeholder-shown + span {
  top: 0.75rem;
  font-size: 0.9em;
}

.form label .input:focus + span,
.form label .input:valid + span {
  top: -0.75rem;
  font-size: 0.7em;
  font-weight: 600;
  color: var(--color-accent-blue);
  background-color: var(--color-white);
  padding: 0 0.25rem;
}

.form label .input:valid + span {
  color: var(--color-accent-green);
}

.submit,
.dropzone-actions button {
  border: none;
  outline: none;
  background-color: var(--color-accent-blue);
  padding: 0.8rem 1rem;
  border-radius: var(--border-radius-small);
  color: var(--color-primary);
  font-size: 1rem;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.submit::before,
.dropzone-actions button:hover::before {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(
    120deg,
    transparent,
    rgba(255, 255, 255, 0.3),
    transparent
  );
  transition: all 0.5s ease;
}

.submit:hover::before,
.dropzone-actions button:hover::before {
  left: 100%;
}

.dropzone-area {
  padding: 1rem;
  position: relative;
  min-height: 16rem;
  display: flex;
  text-align: center;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  border: 2px dashed var(--color-primary);
  border-radius: var(--border-radius-large);
  color: var(--color-primary);
  cursor: pointer;
  transition: 
    background-color var(--transition-speed) ease,
    border-style var(--transition-speed) ease;
}

.dropzone-area [type="file"] {
  cursor: pointer;
  position: absolute;
  opacity: 0;
  inset: 0;
}

.dropzone-area .file-upload-icon svg {
  height: 5rem;
  width: 5rem;
  margin-bottom: 0.5rem;
  stroke: var(--color-primary);
}

.dropzone--over {
  border-style: solid;
  background-color: var(--color-gray-light);
}

.dropzone-actions {
  display: flex;
  justify-content: space-between;
  padding-top: 1rem;
  margin-top: 1rem;
  border-top: 1px solid var(--color-gray-light);
  gap: 1rem;
  flex-wrap: wrap;
}

.dropzone-actions button {
  flex-grow: 1;
  min-height: 3rem;
  font-size: 1rem;
}

.dropzone-actions button[type="reset"] {
  background-color: transparent;
  border: 1px solid var(--color-gray-light);
  color: var(--color-primary);
}

@media (max-width: 768px) {
  .container {
    flex-direction: column;
    gap: 1rem;
  }

  .form,
  .dropzone-box {
    width: 100%;
  }
}

.college-id-container {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  margin-top: 1rem;
}

.college-id-container label {
  font-weight: 600;
  color: var(--color-primary);
}

.college-id-container input {
  width: 100%;
  padding: 0.5rem;
  border: 1px solid var(--color-gray-light);
  border-radius: var(--border-radius-small);
}
    </style>
  </head>

  <body>
    <div class="container">
      <form class="dropzone-box" id="upload-form">
        <h2>Upload Images and Enter College Data</h2>

        <!-- College Data Form -->
        <div class="college-data-form">
         
          <p class="message">Enter Norms to be followed for inspection</p>
          <div class="flex">
            <label style="height:50px">
              <input
                required=""
                placeholder=""
                type="text"
                class="input"
                name="branch"
              />
              <span>Branch</span>
            </label>

            <label>
              <input
                required=""
                placeholder=""
                type="number"
                class="input"
                name="itbk"
              />
              <span >Intake of Branch</span>
            </label>
          </div>

          <label>
            <input
              required=""
              placeholder=""
              type="text"
              class="input"
              name="nod"
            />
            <span>Number of Divisions</span>
          </label>

          <label style="height: 90px">
            <input
              required=""
              placeholder=""
              type="number"
              class="input"
              name="nob"
            />
            <span>Number of Batches per Division</span>
          </label>
        </div>

        <!-- Image Upload Section -->
        <p>Select a folder containing images to upload</p>
        <div class="dropzone-area">
          <div class="file-upload-icon">
            <svg fill="#000000" width="800px" height="800px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19,13a1,1,0,0,0-1,1v.38L16.52,12.9a2.79,2.79,0,0,0-3.93,0l-.7.7L9.41,11.12a2.85,2.85,0,0,0-3.93,0L4,12.6V7A1,1,0,0,1,5,6h7a1,1,0,0,0,0-2H5A3,3,0,0,0,2,7V19a3,3,0,0,0,3,3H17a3,3,0,0,0,3-3V14A1,1,0,0,0,19,13ZM5,20a1,1,0,0,1-1-1V15.43l2.9-2.9a.79.79,0,0,1,1.09,0l3.17,3.17,0,0L15.46,20Zm13-1a.89.89,0,0,1-.18.53L13.31,15l.7-.7a.77.77,0,0,1,1.1,0L18,17.21ZM22.71,4.29l-3-3a1,1,0,0,0-.33-.21,1,1,0,0,0-.76,0,1,1,0,0,0-.33.21l-3,3a1,1,0,0,0,1.42,1.42L18,4.41V10a1,1,0,0,0,2,0V4.41l1.29,1.3a1,1,0,0,0,1.42,0A1,1,0,0,0,22.71,4.29Z"/></svg>
          </div>
          <p>Click to upload or drag and drop</p>
          <input
            type="file"
            id="upload-file"
            name="uploaded-files"
            webkitdirectory
            directory
            multiple
          />
          <p class="message">No Files Selected</p>
        </div>

        <!-- College ID Input -->
        <div class="college-id-container">
          <label for="college-id">Enter College ID:</label>
          <input
            type="text"
            id="college-id"
            placeholder="Enter your college ID"
            required
          />
        </div>

        <!-- Form Actions -->
        <div class="dropzone-actions">
          <button type="reset">Cancel</button>
          <button id="submit-button" type="submit">Save</button>
        </div>
      </form>
    </div>

    <script>
      const dropzoneBox = document.getElementsByClassName("dropzone-box")[0];
      const inputFiles = document.querySelectorAll(
        ".dropzone-area input[type='file']"
      );
      const inputElement = inputFiles[0];
      const dropZoneElement = inputElement.closest(".dropzone-area");

      inputElement.addEventListener("change", (e) => {
        if (inputElement.files.length) {
          updateDropzoneFileList(dropZoneElement, inputElement.files[0]);
        }
      });

      dropZoneElement.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZoneElement.classList.add("dropzone--over");
      });

      ["dragleave", "dragend"].forEach((type) => {
        dropZoneElement.addEventListener(type, (e) => {
          dropZoneElement.classList.remove("dropzone--over");
        });
      });

      dropZoneElement.addEventListener("drop", (e) => {
        e.preventDefault();
        if (e.dataTransfer.files.length) {
          inputElement.files = e.dataTransfer.files;
          updateDropzoneFileList(dropZoneElement, e.dataTransfer.files[0]);
        }
        dropZoneElement.classList.remove("dropzone--over");
      });

      const updateDropzoneFileList = (dropzoneElement, file) => {
        let dropzoneFileMessage = dropzoneElement.querySelector(".message");
        dropzoneFileMessage.innerHTML = `${file.name}, ${file.size} bytes`;
      };

      dropzoneBox.addEventListener("reset", (e) => {
        let dropzoneFileMessage = dropZoneElement.querySelector(".message");
        dropzoneFileMessage.innerHTML = `No Files Selected`;
      });

      document
        .getElementById("upload-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const fileInput = document.getElementById("upload-file");
          const files = Array.from(fileInput.files);
          const currentRoute = window.location.pathname;

          // Get values from the form fields
          const collegeId = document.getElementById("college-id").value; // Get the college ID
          const branch = document.querySelector('input[name="branch"]').value; // Get the branch
          const itbk = document.querySelector('input[name="itbk"]').value; // Get the intake of branch
          const nod = document.querySelector('input[name="nod"]').value; // Get the number of divisions
          const nob = document.querySelector('input[name="nob"]').value; // Get the number of batches

          if (!collegeId) {
            alert("Unable to determine college ID.");
            return;
          }

          if (files.length) {
            const imageFiles = files.filter((file) =>
              file.type.startsWith("image/")
            );

            if (!imageFiles.length) {
              alert("No image files found in the selected folder.");
              return;
            }

            for (const imageFile of imageFiles) {
              const formData = new FormData();
              formData.append("image", imageFile);
              formData.append("route", currentRoute);
              formData.append("college_id", collegeId);
              formData.append("branch", branch);
              formData.append("itbk", itbk);
              formData.append("nod", nod);
              formData.append("nob", nob);

              try {
                const response = await fetch("/classroom_upload/upload_ui/", {
                  method: "POST",
                  body: formData,
                });

                if (response.ok) {
                  const result = await response.json();
                  console.log("Uploaded:", result);
                } else {
                  console.error("Error during upload");
                }
              } catch (error) {
                console.error("Upload error:", error);
              }
            }

            alert("All valid images uploaded.");
          } else {
            alert("Please select some files to upload.");
          }
        });
    </script>
  </body>
</html>
