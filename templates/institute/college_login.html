{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/institute/college_login.css' %}">
    <title>College Login</title>
</head>
<body>
    <header>
        <!-- You can add a logo or navigation here if needed -->
    </header>
    <div class="login">
        <img src="{% static 'images/login_bg4.jpeg' %}" alt="login image" class="login__img">

        <form action="{% url 'college_login_check' %}" method="POST" class="login__form">
            {% csrf_token %}
            <h1 class="login__title">Login</h1>

            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}<br><br>

            <div class="login__content">
                <div class="login__box">
                    <div class="login__box-input">
                        <input type="text" name="college_name" required class="login__input" id="login-email" placeholder=" ">
                        <label for="login-email" class="login__label">College Name</label>
                    </div>
                </div>

                <div class="login__box">
                    <div class="login__box-input">
                        <input type="text" name="college_code" required class="login__input" id="login-code" placeholder=" ">
                        <label for="login-code" class="login__label">College Code</label>
                    </div>
                </div>

                <div class="login__box">
                    <div class="login__box-input">
                        <input type="password" name="password" required class="login__input" id="login-password" placeholder=" ">
                        <label for="login-password" class="login__label">Password</label>
                        <i class="ri-eye-off-line login__eye" id="toggle-password" onclick="togglePasswordVisibility('login-password', 'toggle-password')"></i>
                    </div>
                </div>
            </div>

            <button type="submit" class="option-btn login__button">Login</button>

            <div class="login__register" style="color: rgb(248, 244, 244); font-size: large;">
                Don't have an account? <a href="{% url 'signup' %}" style="color: rgb(248, 244, 244); font-size: large;">Sign up</a>
            </div>
        </form>
    </div>

    <script>
        function togglePasswordVisibility(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const toggleIcon = document.getElementById(iconId);
            
            if (passwordInput.type === "password") {
                passwordInput.type = "text"; // Show password
                toggleIcon.classList.remove('ri-eye-off-line');
                toggleIcon.classList.add('ri-eye-line'); // Change to eye icon
            } else {
                passwordInput.type = "password"; // Hide password
                toggleIcon.classList.remove('ri-eye-line');
                toggleIcon.classList.add('ri-eye-off-line'); // Change to eye-off icon
            }
        }
    </script>
</body>
</html>
