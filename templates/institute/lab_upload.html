<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GevStack - Form and Dropzone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
        text-decoration: none;
      }

      :root {
        --primary: #000;
        --white: #fff;
        --background: #bed7dc;
        --gray: #d3d3d3;
        --input-border-focus: #03a9f4;
        --input-label-active: #03a9f4;
      }

      body {
        font-family: "Work Sans", sans-serif;
        background-color: #bed7dc;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        padding: 1rem;
      }

      .container {
        display: flex;
        gap: 1.5rem;
        max-width: 900px;
        width: 100%;
        justify-content: space-between;
      }

      .form,
      .dropzone-box {
        flex: 1;
        background-color: var(--white);
        border-radius: 1rem;
        padding: 2rem;
        box-shadow: rgba(0, 0, 0, 0.2) 0px 5px 15px;
        display: flex;
        flex-direction: column;
      }

      .form {
        max-width: 100%;
      }

      .title {
        font-size: 1.75rem;
        font-weight: 600;
        margin-bottom: 1rem;
        position: relative;
      }

      .message {
        color: rgba(88, 87, 87, 0.822);
        font-size: 1rem;
        margin-bottom: 1rem;
      }

      .flex {
        display: flex;
        width: 100%;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .form label {
        position: relative;
        width: 100%;
      }

      .form label .input {
        width: 100%;
        padding: 0.5rem 0.5rem 1.5rem 0.5rem;
        border: 2px solid var(--gray);
        border-radius: 0.5rem;
        margin-bottom: 1rem;
        background-color: transparent;
        color: var(--primary);
        outline: none;
        transition: all 0.3s ease;
      }

      .form label .input:focus {
        border-color: var(--input-border-focus);
        box-shadow: 0 0 8px rgba(3, 169, 244, 0.3);
      }

      .form label .input + span {
        position: absolute;
        left: 0.5rem;
        top: 0.75rem;
        color: grey;
        font-size: 0.9em;
        cursor: text;
        transition: 0.3s ease;
        pointer-events: none;
      }

      .form label .input:placeholder-shown + span {
        top: 0.75rem;
        font-size: 0.9em;
      }

      .form label .input:focus + span,
      .form label .input:valid + span {
        top: -0.75rem;
        font-size: 0.7em;
        font-weight: 600;
        color: var(--input-label-active);
        background-color: var(--white);
        padding: 0 0.25rem;
      }

      .form label .input:valid + span {
        color: green;
      }

      .submit {
        border: none;
        outline: none;
        background-color: #03a9f4;
        padding: 0.8rem 1rem;
        border-radius: 0.5rem;
        color: black;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }
      .submit::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          120deg,
          transparent,
          rgba(255, 255, 255, 0.3),
          transparent
        );
        transition: all 0.5s ease;
      }

      .submit:hover::before {
        left: 100%;
      }

      .dropzone-box h2 {
        font-size: 1.75rem;
        margin-bottom: 1rem;
      }

      .dropzone-area {
        padding: 1rem;
        position: relative;
        margin-top: 1rem;
        min-height: 16rem;
        display: flex;
        text-align: center;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        border: 2px dashed var(--primary);
        border-radius: 1rem;
        color: var(--primary);
        cursor: pointer;
      }

      .dropzone-area [type="file"] {
        cursor: pointer;
        position: absolute;
        opacity: 0;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
      }

      .dropzone-area .file-upload-icon svg {
        height: 5rem;
        width: 5rem;
        margin-bottom: 0.5rem;
        stroke: var(--primary);
      }

      .dropzone--over {
        border-style: solid;
        background-color: var(--gray);
      }

      .dropzone-actions {
        display: flex;
        justify-content: space-between;
        padding-top: 1rem;
        margin-top: 1rem;
        border-top: 1px solid var(--gray);
        gap: 1rem;
        flex-wrap: wrap;
      }

      .dropzone-actions button {
        flex-grow: 1;
        min-height: 3rem;
        font-size: 1rem;
      }

      .dropzone-actions button:hover {
        text-decoration: underline;
      }

      .dropzone-actions button[type="reset"] {
        background-color: transparent;
        border: 1px solid var(--gray);
        border-radius: 0.5rem;
        padding: 0.5rem 1rem;
        color: var(--primary);
        cursor: pointer;
      }

      .dropzone-actions button[type="submit"] {
        background-color: #03a9f4;
        border: 1px solid var(--primary);
        border-radius: 0.5rem;
        padding: 0.5rem 1rem;
        color: black;
        cursor: pointer;
      }

      @media (max-width: 768px) {
        .container {
          flex-direction: column;
          gap: 1rem;
        }

        .form,
        .dropzone-box {
          width: 100%;
        }
      }

      button {
        background-color: black;
        margin-left: 10px;
        border-radius: 10px;
        padding: 10px;
        width: 90px;
      }

      button a {
        color: white;
        font-weight: bold;
        font-size: 15px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <form class="dropzone-box" id="upload-form">
        <h2>Upload Images and Enter College Data</h2>

        <!-- College Data Form -->
        <div class="college-data-form">
          <p class="title">Enter College Data</p>
          <p class="message">Enter Norms to be followed for inspection</p>
          <div class="flex">
            <label style="height: 50px">
              <input
                required=""
                placeholder=""
                type="text"
                class="input"
                name="branch"
              />
              <span>Branch</span>
            </label>

            <label>
              <input
                required=""
                placeholder=""
                type="number"
                class="input"
                name="itbk"
              />
              <span>Intake of Branch</span>
            </label>
          </div>

          <label>
            <input
              required=""
              placeholder=""
              type="text"
              class="input"
              name="nod"
            />
            <span>Number of Divisions</span>
          </label>

          <label style="height: 90px">
            <input
              required=""
              placeholder=""
              type="number"
              class="input"
              name="nob"
            />
            <span>Number of Batches per Division</span>
          </label>
        </div>

        <!-- Image Upload Section -->
        <p>Select a folder containing images to upload</p>
        <div class="dropzone-area">
          <div class="file-upload-icon">
            <svg
              width="50px"
              height="50px"
              viewBox="0 0 20 20"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M10 0C4.5 0 0 4.5 0 10s4.5 10 10 10 10-4.5 10-10S15.5 0 10 0zM15 9h-4V5H9v4H5v2h4v4h2v-4h4V9z"
                fill="#000000"
              />
            </svg>
          </div>
          <p>Click to upload or drag and drop</p>
          <input
            type="file"
            id="upload-file"
            name="uploaded-files"
            webkitdirectory
            directory
            multiple
          />
          <p class="message">No Files Selected</p>
        </div>

        <!-- College ID Input -->
        <div class="college-id-container">
          <label for="college-id">Enter College ID:</label>
          <input
            type="text"
            id="college-id"
            placeholder="Enter your college ID"
            required
          />
        </div>

        <!-- Form Actions -->
        <div class="dropzone-actions">
          <button type="reset">Cancel</button>
          <button id="submit-button" type="submit">Save</button>
        </div>
      </form>
    </div>

    <script>
      const dropzoneBox = document.getElementsByClassName("dropzone-box")[0];
      const inputFiles = document.querySelectorAll(
        ".dropzone-area input[type='file']"
      );
      const inputElement = inputFiles[0];
      const dropZoneElement = inputElement.closest(".dropzone-area");

      inputElement.addEventListener("change", (e) => {
        if (inputElement.files.length) {
          updateDropzoneFileList(dropZoneElement, inputElement.files[0]);
        }
      });

      dropZoneElement.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZoneElement.classList.add("dropzone--over");
      });

      ["dragleave", "dragend"].forEach((type) => {
        dropZoneElement.addEventListener(type, (e) => {
          dropZoneElement.classList.remove("dropzone--over");
        });
      });

      dropZoneElement.addEventListener("drop", (e) => {
        e.preventDefault();
        if (e.dataTransfer.files.length) {
          inputElement.files = e.dataTransfer.files;
          updateDropzoneFileList(dropZoneElement, e.dataTransfer.files[0]);
        }
        dropZoneElement.classList.remove("dropzone--over");
      });

      const updateDropzoneFileList = (dropzoneElement, file) => {
        let dropzoneFileMessage = dropzoneElement.querySelector(".message");
        dropzoneFileMessage.innerHTML = `${file.name}, ${file.size} bytes`;
      };

      dropzoneBox.addEventListener("reset", (e) => {
        let dropzoneFileMessage = dropZoneElement.querySelector(".message");
        dropzoneFileMessage.innerHTML = `No Files Selected`;
      });

      document
        .getElementById("upload-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const fileInput = document.getElementById("upload-file");
          const files = Array.from(fileInput.files);
          const currentRoute = window.location.pathname;

          // Get values from the form fields
          const collegeId = document.getElementById("college-id").value; // Get the college ID
          const branch = document.querySelector('input[name="branch"]').value; // Get the branch
          const itbk = document.querySelector('input[name="itbk"]').value; // Get the intake of branch
          const nod = document.querySelector('input[name="nod"]').value; // Get the number of divisions
          const nob = document.querySelector('input[name="nob"]').value; // Get the number of batches

          if (!collegeId) {
            alert("Unable to determine college ID.");
            return;
          }

          if (files.length) {
            const imageFiles = files.filter((file) =>
              file.type.startsWith("image/")
            );

            if (!imageFiles.length) {
              alert("No image files found in the selected folder.");
              return;
            }

            for (const imageFile of imageFiles) {
              const formData = new FormData();
              formData.append("image", imageFile);
              formData.append("route", currentRoute);
              formData.append("college_id", collegeId);
              formData.append("branch", branch);
              formData.append("itbk", itbk);
              formData.append("nod", nod);
              formData.append("nob", nob);

              try {
                const response = await fetch("/classroom_upload/upload_ui/", {
                  method: "POST",
                  body: formData,
                });

                if (response.ok) {
                  const result = await response.json();
                  console.log("Uploaded:", result);
                } else {
                  console.error("Error during upload");
                }
              } catch (error) {
                console.error("Upload error:", error);
              }
            }

            alert("All valid images uploaded.");
          } else {
            alert("Please select some files to upload.");
          }
        });
    </script>
  </body>
</html>
